<!DOCTYPE html>

        <main class="container py-5">
            <!-- Submenu de Servicios -->
            <div class="row row-cols-1 row-cols-md-3 g-4 justify-content-center">
                <div class="col"><a th:href="@{/diagnostico/listado}" class="af-pill">[[#{plantilla.diagnosticos}]]</a></div>
                <div class="col"><a th:href="@{/orden/listado}" class="af-pill">[[#{plantilla.ordenes}]]</a></div>

            </div>
        </main>

        <!-- Nombre de la seccion en la esquina inferior izquierda -->

        <footer th:replace="~{general/fragmentos :: footer}"/>
