<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head}"/>
    <body>
        <header th:replace="~{general/fragmentos :: header}"/>

        <main>
            <section class="container py-3">
                <div class="af-tarjeta mx-auto" style="max-width: 640px;">
                    <div class="mb-3">
                        <a th:href="@{/}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i> [[#{accion.regresar}]]</a>
                    </div>
                    <h1 class="af-tarjeta-titulo h4 text-center mb-2">[[#{recepcion.inicio.titulo}]]</h1>
                    <p class="text-center">[[#{recepcion.inicio.texto}]]</p>

                    <div class="d-grid gap-3 mt-4">
                        <a th:href="@{/recepcion/con-reserva}" class="btn btn-primary btn-lg">
                            <i class="fa-solid fa-calendar-check"></i> [[#{recepcion.conreserva}]]</a>
                        <a th:href="@{/recepcion/sin-reserva}" class="btn btn-primary btn-lg">
                            <i class="fa-solid fa-car"></i> [[#{recepcion.sinreserva}]]</a>
                    </div>
                </div>
            </section>
        </main>

        <!-- Nombre de la seccion -->
        <div class="container pb-3"><span class="af-ruta">[[#{plantilla.recepcion}]]</span></div>

        <footer th:replace="~{general/fragmentos :: footer}"/>
    </body>
</html>
