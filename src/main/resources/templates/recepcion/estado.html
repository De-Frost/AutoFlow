<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}"></head>

    <body>

        <header th:replace="~{general/fragmentos :: header}"></header>

        <main class="container af-hu16">

            <section class="af-tarjeta af-orden">

                <h1>[[#{recepcion.estadoinicial}]]</h1>

                <p>
                    [[#{recepcion.estadotexto}]]
                </p>

                <h3 class="mt-4">[[#{recepcion.infovehiculo}]]</h3>

                <p>
                    <strong>[[#{recepcion.placa}]]:</strong>
                    <span th:text="${reserva.vehiculo.placa}"></span>
                </p>

                <p>
                    <strong>[[#{recepcion.cliente}]]:</strong>
                    <span th:text="${reserva.cliente.nombre}"></span>
                </p>

                <form th:action="@{/recepcion/guardar-con-reserva/{id}(id=${reserva.idReserva})}"
                      th:object="${recepcion}"
                      method="post">

                    <!-- Kilometraje -->
                    <div class="mb-3">

                        <label for="kilometraje" class="form-label">
                            [[#{recepcion.kilometraje}]]
                        </label>

                        <input type="number"
                               id="kilometraje"
                               th:field="*{kilometraje}"
                               class="form-control"
                               min="0"
                               required>

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('kilometraje')}"
                             th:errors="*{kilometraje}">
                        </div>

                    </div>

                    <!-- Nivel de combustible -->
                    <div class="mb-3">

                        <label for="nivelCombustible" class="form-label">
                            [[#{recepcion.combustible}]]
                        </label>

                        <select id="nivelCombustible"
                                th:field="*{nivelCombustible}"
                                class="form-select"
                                required>

                            <option value="" th:text="#{recepcion.seleccione}"></option>
                            <option value="Vacio" th:text="#{recepcion.vacio}"></option>
                            <option value="1/4">1/4</option>
                            <option value="1/2">1/2</option>
                            <option value="3/4">3/4</option>
                            <option value="Lleno" th:text="#{recepcion.lleno}"></option>

                        </select>

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('nivelCombustible')}"
                             th:errors="*{nivelCombustible}">
                        </div>

                    </div>

                    <!-- Daños visibles -->
                    <div class="mb-3">

                        <label for="danosVisibles" class="form-label">
                            [[#{recepcion.danos}]]
                        </label>

                        <textarea id="danosVisibles"
                                  th:field="*{danosVisibles}"
                                  class="form-control"
                                  maxlength="255"
                                  rows="3"
                                  th:placeholder="#{recepcion.danos.placeholder}"></textarea>

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('danosVisibles')}"
                             th:errors="*{danosVisibles}">
                        </div>

                    </div>

                    <!-- Objetos personales -->
                    <div class="mb-3">

                        <label for="objetosPersonales" class="form-label">
                            [[#{recepcion.objetos}]]
                        </label>

                        <textarea id="objetosPersonales"
                                  th:field="*{objetosPersonales}"
                                  class="form-control"
                                  maxlength="255"
                                  rows="3"
                                  th:placeholder="#{recepcion.objetos.placeholder}"></textarea>

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('objetosPersonales')}"
                             th:errors="*{objetosPersonales}">
                        </div>

                    </div>

                    <!-- Falla reportada -->
                    <div class="mb-3">

                        <label for="fallaReportada" class="form-label">
                            [[#{recepcion.falla}]]
                        </label>

                        <textarea id="fallaReportada"
                                  th:field="*{fallaReportada}"
                                  class="form-control"
                                  maxlength="255"
                                  rows="3"
                                  required></textarea>

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('fallaReportada')}"
                             th:errors="*{fallaReportada}">
                        </div>

                    </div>

                    <!-- Botones -->
                    <div class="mt-4">

                        <button type="submit" class="af-boton">
                            [[#{recepcion.guardar}]]
                        </button>

                        <a th:href="@{/recepcion/con-reserva/{id}(id=${reserva.idReserva})}"
                           class="af-boton">
                            [[#{accion.regresar}]]
                        </a>

                    </div>

                </form>

            </section>

        </main>

        <div class="container pb-3 af-ruta">
            [[#{plantilla.recepcion}]] / [[#{recepcion.ruta.estado}]]
        </div>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>

    </body>
</html>
