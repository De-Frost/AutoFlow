<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}"></head>
<body><header th:replace="~{general/fragmentos :: header}"></header>
<main class="container af-hu16"><section class="af-tarjeta af-orden">
<h1>Seleccionar mecánico</h1>
<p th:if="${#lists.isEmpty(mecanicos)}">No hay mecánicos activos disponibles.</p>
<article class="af-mecanico" th:each="mecanico : ${mecanicos}"><div><strong th:text="${mecanico.nombre}"></strong><p th:text="${mecanico.carga + ' órdenes asignadas'}"></p></div>
<form method="post" th:action="@{/orden/{id}/asignar(id=${orden.idOrden})}"><input type="hidden" name="idMecanico" th:value="${mecanico.id}"/><button class="af-seleccionar" type="submit">Seleccionar</button></form></article>
<a th:href="@{/orden/{id}(id=${orden.idOrden})}">← Volver a la orden</a>
</section></main><div class="container pb-3 af-ruta">Mecánicos / Servicios</div>
<footer th:replace="~{general/fragmentos :: footer}"></footer></body></html>
