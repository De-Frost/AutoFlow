<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}"></head>
<body><header th:replace="~{general/fragmentos :: header}"></header>
<main class="container af-hu16"><section class="af-tarjeta af-orden"><h1>[[#{orden.nueva}]]</h1>
<p>[[#{orden.seleccionediagnostico}]]</p>
<p th:if="${#lists.isEmpty(diagnosticos)}">[[#{orden.sindiagnosticos}]]</p>
<article class="af-mecanico" th:each="d : ${diagnosticos}">
<div><strong th:text="${d.recepcion.vehiculo.cliente.nombre}"></strong><p th:text="${d.recepcion.vehiculo.placa}"></p></div>
<a class="af-seleccionar" th:href="@{/orden/generar/{id}(id=${d.idDiagnostico})}">[[#{accion.seleccionar}]]</a></article>
<a th:href="@{/orden/listado}">← [[#{orden.listado}]]</a></section></main><div class="container pb-3 af-ruta">[[#{plantilla.ordenes}]] / [[#{plantilla.servicios}]]</div>
<footer th:replace="~{general/fragmentos :: footer}"></footer></body></html>
